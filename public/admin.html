<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background: #f5f5f5;
        }
        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }
        input {
            width: 90%;
            max-width: 350px;
            padding: 12px;
            margin: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 12px 25px;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Update Dynamic QR</h1>

    <input id="id" placeholder="QR ID">
    <br>
    <input id="destination" placeholder="New destination URL">
    <br>
    <button onclick="updateQR()">Update</button>

    <p id="result"></p>
</div>

<script>
async function updateQR() {
    const id = document.getElementById("id").value.trim();
    const destination = document.getElementById("destination").value.trim();

    if (!id || !destination) {
        alert("Enter both QR ID and destination.");
        return;
    }

    const response = await fetch(`/api/update/${encodeURIComponent(id)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ destination })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        data.message || data.error;
}
</script>
</body>
</html>
